<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <title>PneuTrack Cloud – Veicoli</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:30px;}
    nav a{margin-right:12px;text-decoration:none;color:#0a58ca}
    table{border-collapse:collapse;width:100%;margin-top:12px}
    th,td{border:1px solid #ddd;padding:8px}
    th{background:#f1f5f9;text-align:left}
    form input,form select{margin-right:8px;padding:6px}
    button{padding:6px 10px;cursor:pointer}
    .muted{color:#6b7280}
  </style>
</head>
<body>
  {% include "_header.html" %}

  <h2>Veicoli</h2>
  <form method="POST" action="/add_vehicle">
    <input name="plate" placeholder="Targa" required>
    <input name="brand" placeholder="Marca">
    <input name="model" placeholder="Modello">
    <select name="client_id" required>
      <option value="">Cliente proprietario…</option>
      {% for c in clients %}
        <option value="{{ c.id }}" {% if client_id and client_id == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
    <button type="submit">Aggiungi veicolo</button>
  </form>

  {% if vehicles %}
  <table>
    <thead><tr><th>Targa</th><th>Marca</th><th>Modello</th><th>Cliente</th><th>Azioni</th></tr></thead>
    <tbody>
      {% for v in vehicles %}
      <tr>
        <td>{{ v.plate }}</td>
        <td>{{ v.brand or '-' }}</td>
        <td>{{ v.model or '-' }}</td>
        <td>{{ v.client.name if v.client else '-' }}</td>
        <td>
          <a href="/tires?vehicle_id={{ v.id }}">Gomme</a> |
          <a href="/delete_vehicle/{{ v.id }}" onclick="return confirm('Eliminare?')">Elimina</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
    <p class="muted">Nessun veicolo.</p>
  {% endif %}
</body>
</html>
